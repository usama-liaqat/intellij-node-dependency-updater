name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure --stacktrace

      # Runs the JetBrains Plugin Verifier — the same bytecode analysis behind the compatibility
      # report on the Marketplace listing. verifyPluginStructure above only validates plugin.xml,
      # so deprecated/experimental API usages used to reach the store before anyone noticed.
      #
      # Caches the whole ~/.pluginVerifier tree, not just ides/. Verified locally: `ides/` stays
      # empty because the Gradle plugin supplies the IDE from the Gradle cache, while resolving
      # <depends>JavaScript</depends> and its transitive tree pulls ~850 MB of plugins from the
      # Marketplace into loaded-plugins/ and extracted-plugins/. That is the expensive part.
      - name: Cache Plugin Verifier downloads
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts') }}
          restore-keys: plugin-verifier-${{ runner.os }}-

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          retention-days: 14

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
